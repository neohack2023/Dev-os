name: DevOS GitHub Authority Validation

on:
  push:
    branches: ["main", "devos/**"]
  pull_request:

jobs:
  github-authority:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate portable package
        run: python Devos/runtime/devos.py validate --package-only
      - name: Exercise GitHub authority state machine
        run: python -m unittest discover -s Devos/tests -p 'test_github_authority_adapter.py' -v
      - name: Verify schema v7 and authority surfaces
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "Devos/runtime")
          from db_runtime import CURRENT_SCHEMA_VERSION
          assert CURRENT_SCHEMA_VERSION == 7
          from github_authority_adapter import _REMOTE_EFFECT
          assert _REMOTE_EFFECT == "GITHUB_TARGET_BRANCH_UPDATED"
          PY
