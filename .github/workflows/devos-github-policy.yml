name: DevOS GitHub Policy Validation

on:
  push:
    branches: ["main", "devos/**"]
  pull_request:

jobs:
  github-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate portable package
        run: python Devos/runtime/devos.py validate --package-only
      - name: Exercise GitHub policy bootstrap
        run: python -m unittest Devos.tests.test_github_policy_bootstrap -v
      - name: Verify schema v8 policy surfaces
        run: |
          python - <<'PY'
          import sqlite3, tempfile
          from pathlib import Path
          import sys
          sys.path.insert(0, 'Devos/runtime')
          from db_runtime import connect_runtime, CURRENT_SCHEMA_VERSION
          with tempfile.TemporaryDirectory() as td:
              c=connect_runtime(Path(td)/'policy.db')
              assert CURRENT_SCHEMA_VERSION == 8
              names={row[0] for row in c.execute("SELECT name FROM sqlite_master WHERE type='table'")}
              assert 'github_policy_audits' in names
              assert 'github_policy_receipts' in names
              c.close()
          PY
