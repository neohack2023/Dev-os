name: DevOS Portable Validation

on:
  push:
    branches: ["main", "devos/**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate portable package
        run: python Devos/runtime/devos.py validate --package-only
      - name: Run DevOS tests
        run: python -m unittest discover -s Devos/tests -v
      - name: Validate task queue fixture
        run: python Devos/runtime/task_queue.py --devos-root Devos/tests/fixtures/task_queue validate
      - name: Validate repository fixture
        run: python Devos/runtime/repo_validator.py --devos-root Devos/tests/fixtures/repo_validator/host/Devos --host-root Devos/tests/fixtures/repo_validator/host validate
      - name: Build and query knowledge DB fixture
        run: |
          python Devos/runtime/build_knowledge_db.py --devos-root Devos/tests/fixtures/knowledge_db/host/Devos --host-root Devos/tests/fixtures/knowledge_db/host --db /tmp/devos-knowledge.db build
          python Devos/runtime/build_knowledge_db.py --db /tmp/devos-knowledge.db query lantern
          python Devos/runtime/build_knowledge_db.py --db /tmp/devos-knowledge.db health
      - name: Build branch-aware context packet
        run: |
          python Devos/runtime/knowledge_runtime.py --devos-root Devos/tests/fixtures/knowledge_db/host/Devos --host-root Devos/tests/fixtures/knowledge_db/host --db /tmp/devos-knowledge.db status
          python Devos/runtime/knowledge_runtime.py --devos-root Devos/tests/fixtures/knowledge_db/host/Devos --host-root Devos/tests/fixtures/knowledge_db/host --db /tmp/devos-knowledge.db packet lantern --branch feature-lantern --max-document-chars 4000
      - name: Admit and inspect evidence fixture
        run: |
          python Devos/runtime/evidence_store.py --devos-root Devos/tests/fixtures/knowledge_db/host/Devos --host-root Devos/tests/fixtures/knowledge_db/host --db /tmp/devos-knowledge.db admit Devos/tests/fixtures/evidence/episode-convergence.json
          python Devos/runtime/evidence_store.py --devos-root Devos/tests/fixtures/knowledge_db/host/Devos --host-root Devos/tests/fixtures/knowledge_db/host --db /tmp/devos-knowledge.db list --branch feature-lantern
