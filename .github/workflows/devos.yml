name: DevOS Portable Validation

on:
  push:
    branches: ["main", "devos/**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate portable package
        run: python Devos/runtime/devos.py validate --package-only
      - name: Run DevOS tests
        run: python -m unittest discover -s Devos/tests -v
      - name: Validate task queue fixture
        run: python Devos/runtime/task_queue.py --devos-root Devos/tests/fixtures/task_queue validate
      - name: Validate repository fixture
        run: python Devos/runtime/repo_validator.py --devos-root Devos/tests/fixtures/repo_validator/host/Devos --host-root Devos/tests/fixtures/repo_validator/host validate
      - name: Build and query knowledge DB fixture
        run: |
          python Devos/runtime/build_knowledge_db.py --devos-root Devos/tests/fixtures/knowledge_db/host/Devos --host-root Devos/tests/fixtures/knowledge_db/host --db /tmp/devos-knowledge.db build
          python Devos/runtime/build_knowledge_db.py --db /tmp/devos-knowledge.db query lantern
          python Devos/runtime/build_knowledge_db.py --db /tmp/devos-knowledge.db health
      - name: Build branch-aware context packet
        run: |
          python Devos/runtime/knowledge_runtime.py --devos-root Devos/tests/fixtures/knowledge_db/host/Devos --host-root Devos/tests/fixtures/knowledge_db/host --db /tmp/devos-knowledge.db status
          python Devos/runtime/knowledge_runtime.py --devos-root Devos/tests/fixtures/knowledge_db/host/Devos --host-root Devos/tests/fixtures/knowledge_db/host --db /tmp/devos-knowledge.db packet lantern --branch feature-lantern --max-document-chars 4000
      - name: Admit and inspect evidence fixture
        run: |
          python Devos/runtime/evidence_store.py --devos-root Devos/tests/fixtures/knowledge_db/host/Devos --host-root Devos/tests/fixtures/knowledge_db/host --db /tmp/devos-knowledge.db admit Devos/tests/fixtures/evidence/episode-convergence.json
          python Devos/runtime/evidence_store.py --devos-root Devos/tests/fixtures/knowledge_db/host/Devos --host-root Devos/tests/fixtures/knowledge_db/host --db /tmp/devos-knowledge.db list --branch feature-lantern
      - name: Derive and inspect reflection fixture
        run: |
          DELTA_ID=$(python - <<'PY'
          import sqlite3
          connection = sqlite3.connect("/tmp/devos-knowledge.db")
          try:
              print(connection.execute("SELECT delta_id FROM evidence_delta_packets ORDER BY created_at, delta_id LIMIT 1").fetchone()[0])
          finally:
              connection.close()
          PY
          )
          python Devos/runtime/reflection_store.py --db /tmp/devos-knowledge.db reflect --delta "$DELTA_ID" --request Devos/tests/fixtures/reflection/request-lantern.json
          python Devos/runtime/reflection_store.py --db /tmp/devos-knowledge.db list --branch feature-lantern
      - name: Admit and inspect learning fixture
        run: |
          python - <<'PY'
          import json, sqlite3
          connection = sqlite3.connect("/tmp/devos-knowledge.db")
          connection.row_factory = sqlite3.Row
          try:
              row = connection.execute("SELECT reflection_id,payload_json FROM reflection_candidates WHERE branch_key='feature-lantern' ORDER BY created_at,reflection_id LIMIT 1").fetchone()
              payload = json.loads(row["payload_json"])
              bundle = {
                  "observed_at": "2026-09-13T23:20:00+00:00",
                  "procedure": {
                      "branch_scope": "feature-lantern",
                      "name": "lantern-stability-check",
                      "version": "1",
                      "trigger_conditions": ["lantern state available"],
                      "input_schema": ["state"],
                      "output_schema": ["stable"],
                      "implementation_ref": "tests:lantern_stability_check",
                      "source_reflection_ids": [row["reflection_id"]],
                      "source_evidence_refs": payload["source_evidence_refs"],
                      "known_failures": ["hidden mutable ordering"]
                  },
                  "evaluation": {"results": [
                      {"fixture_id":"inv","tier":"T0","passed":True,"input_identity":"contract"},
                      {"fixture_id":"known","tier":"T1","passed":True,"input_identity":"fixture-A"},
                      {"fixture_id":"dev","tier":"T2","passed":True,"input_identity":"fixture-B"},
                      {"fixture_id":"holdout","tier":"T3","passed":True,"input_identity":"fixture-C"},
                      {"fixture_id":"regression","tier":"T4","passed":True,"input_identity":"fixture-R"},
                      {"fixture_id":"canary","tier":"T5","passed":True,"input_identity":"real-canary"}
                  ]},
                  "capability": {
                      "capability_key": "lantern.stability",
                      "description": "Recognize deterministic lantern state across unseen inputs.",
                      "known_tasks": ["lantern stability"],
                      "known_failure_modes": ["hidden mutable ordering"]
                  },
                  "experience": {
                      "memory_type": "PROCEDURAL",
                      "statement": "Lantern stability procedure transferred to held-out input and passed regression plus canary checks."
                  }
              }
              with open("/tmp/learning-bundle.json", "w", encoding="utf-8") as handle:
                  json.dump(bundle, handle, indent=2, sort_keys=True)
          finally:
              connection.close()
          PY
          python Devos/runtime/learning_store.py --db /tmp/devos-knowledge.db admit /tmp/learning-bundle.json
          python Devos/runtime/learning_store.py --db /tmp/devos-knowledge.db list --branch feature-lantern
      - name: Exercise promotion gate fixture
        run: |
          python - <<'PY'
          import hashlib, json, os, sqlite3
          sha = os.environ["GITHUB_SHA"]
          connection = sqlite3.connect("/tmp/devos-knowledge.db")
          try:
              capability_id = connection.execute("SELECT capability_id FROM learning_capabilities ORDER BY capability_id LIMIT 1").fetchone()[0]
          finally:
              connection.close()
          request = {
              "observed_at": "2026-09-13T23:35:00+00:00",
              "capability_id": capability_id,
              "candidate_revision": sha,
              "change_digest": hashlib.sha256(b"portable-promotion-fixture").hexdigest(),
              "target": {
                  "repository": "owner/fixture",
                  "branch": "main",
                  "paths": ["Devos/runtime/example.py"],
                  "change_ref": f"git:{sha}"
              },
              "expected_benefit": "Exercise the governed promotion handoff.",
              "regression_risk": "Fixture change could violate an unrelated invariant.",
              "falsification_test": "Run the portable test suite on the exact candidate revision.",
              "rollback_plan": "Restore the previous known-good revision and rerun the portable suite.",
              "verification_plan": {
                  "required_checks": [{"name": "portable-test-suite", "source": "workflow-prior-step"}],
                  "require_independent_review": False,
                  "require_canary": False
              },
              "required_authorization": "reviewed repository change",
              "destination_authority": "repository"
          }
          verification = {
              "observed_at": "2026-09-13T23:36:00+00:00",
              "candidate_revision": sha,
              "checks": [{
                  "name": "portable-test-suite",
                  "source": "workflow-prior-step",
                  "status": "success",
                  "revision": sha
              }],
              "rollback": {"ready": True, "triggered": False, "verified": False}
          }
          with open("/tmp/promotion-request.json", "w", encoding="utf-8") as handle:
              json.dump(request, handle, indent=2, sort_keys=True)
          with open("/tmp/promotion-verification.json", "w", encoding="utf-8") as handle:
              json.dump(verification, handle, indent=2, sort_keys=True)
          PY
          python Devos/runtime/promotion_gate.py --db /tmp/devos-knowledge.db propose /tmp/promotion-request.json > /tmp/promotion-envelope.json
          ENVELOPE_ID=$(python - <<'PY'
          import json
          print(json.load(open("/tmp/promotion-envelope.json", encoding="utf-8"))["envelope"]["envelope_id"])
          PY
          )
          python Devos/runtime/promotion_gate.py --db /tmp/devos-knowledge.db verify --envelope "$ENVELOPE_ID" /tmp/promotion-verification.json
          python Devos/runtime/promotion_gate.py --db /tmp/devos-knowledge.db list --branch feature-lantern
      - name: Exercise MASON local execution fixture
        run: |
          rm -rf /tmp/devos-mason-repo
          mkdir -p /tmp/devos-mason-repo/src
          git -C /tmp/devos-mason-repo init -b main
          git -C /tmp/devos-mason-repo config user.email devos@example.invalid
          git -C /tmp/devos-mason-repo config user.name "DevOS Fixture"
          printf 'base\n' > /tmp/devos-mason-repo/src/value.txt
          git -C /tmp/devos-mason-repo add .
          git -C /tmp/devos-mason-repo commit -m base
          export BASE=$(git -C /tmp/devos-mason-repo rev-parse HEAD)
          printf 'candidate\n' > /tmp/devos-mason-repo/src/value.txt
          git -C /tmp/devos-mason-repo add .
          git -C /tmp/devos-mason-repo commit -m candidate
          export CANDIDATE=$(git -C /tmp/devos-mason-repo rev-parse HEAD)
          export DIGEST=$(python - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, "Devos/runtime")
          from mason_execution import compute_change_digest
          print(compute_change_digest(Path("/tmp/devos-mason-repo"), os.environ["BASE"], os.environ["CANDIDATE"]))
          PY
          )
          git -C /tmp/devos-mason-repo reset --hard "$BASE"
          python - <<'PY'
          import json, os, sqlite3
          db = "/tmp/devos-knowledge.db"
          connection = sqlite3.connect(db)
          try:
              capability_id = connection.execute(
                  "SELECT capability_id FROM learning_capabilities ORDER BY capability_id LIMIT 1"
              ).fetchone()[0]
              envelope_id = "promotion-envelope:mason-cli-fixture"
              decision_id = "promotion-decision:mason-cli-fixture"
              envelope = {
                  "schema_version": 1,
                  "envelope_id": envelope_id,
                  "candidate_revision": os.environ["CANDIDATE"],
                  "change_digest": os.environ["DIGEST"],
                  "target": {
                      "repository": "owner/fixture",
                      "branch": "main",
                      "paths": ["src/value.txt"],
                      "change_ref": f"git:{os.environ['CANDIDATE']}"
                  },
                  "required_authorization": "reviewed repository change",
                  "stone_state": "LOCKED",
                  "mason_state": "HANDOFF_REQUIRED",
                  "write_authorized": False
              }
              decision = {
                  "schema_version": 1,
                  "decision_id": decision_id,
                  "envelope_id": envelope_id,
                  "candidate_revision": os.environ["CANDIDATE"],
                  "outcome": "PROMOTE",
                  "next_action": "MASON_REVIEW_PROMOTION",
                  "write_authorized": False
              }
              canon = lambda value: json.dumps(value, sort_keys=True, separators=(",", ":"))
              connection.execute(
                  "INSERT INTO promotion_envelopes(envelope_id,capability_id,branch_scope,candidate_revision,change_digest,stone_state,mason_state,payload_json,observed_at,authority_effect,write_authorized) VALUES (?,?,?,?,?,?,?,?,?,?,0)",
                  (envelope_id, capability_id, "feature-lantern", os.environ["CANDIDATE"], os.environ["DIGEST"], "LOCKED", "HANDOFF_REQUIRED", canon(envelope), "2026-09-13T23:47:00+00:00", "NONE")
              )
              connection.execute(
                  "INSERT INTO promotion_decisions(decision_id,envelope_id,outcome,candidate_revision,verifier_digest,payload_json,observed_at,authority_effect,write_authorized) VALUES (?,?,?,?,?,?,?,?,0)",
                  (decision_id, envelope_id, "PROMOTE", os.environ["CANDIDATE"], "f" * 64, canon(decision), "2026-09-13T23:48:00+00:00", "NONE")
              )
              request = {
                  "observed_at": "2026-09-13T23:49:00+00:00",
                  "base_revision": os.environ["BASE"],
                  "authorization": {
                      "authorization_id": "authorization:mason-cli-fixture",
                      "source": "workflow-fixture",
                      "actor": "workflow-fixture-reviewer",
                      "observed_at": "2026-09-13T23:49:00+00:00",
                      "grant": "MASON_FAST_FORWARD",
                      "decision_id": decision_id,
                      "envelope_id": envelope_id,
                      "candidate_revision": os.environ["CANDIDATE"],
                      "target_branch": "main",
                      "scope": "reviewed repository change",
                      "approved": True
                  }
              }
              with open("/tmp/mason-execution-request.json", "w", encoding="utf-8") as handle:
                  json.dump(request, handle, indent=2, sort_keys=True)
              connection.commit()
          finally:
              connection.close()
          PY
          python Devos/runtime/mason_execution.py --db /tmp/devos-knowledge.db prepare \
            --decision promotion-decision:mason-cli-fixture \
            --repo-root /tmp/devos-mason-repo \
            /tmp/mason-execution-request.json > /tmp/mason-plan.json
          PLAN_ID=$(python - <<'PY'
          import json
          print(json.load(open("/tmp/mason-plan.json", encoding="utf-8"))["plan"]["plan_id"])
          PY
          )
          python Devos/runtime/mason_execution.py --db /tmp/devos-knowledge.db apply \
            --plan "$PLAN_ID" \
            --repo-root /tmp/devos-mason-repo \
            --observed-at 2026-09-13T23:50:00+00:00 > /tmp/mason-receipt.json
          test "$(git -C /tmp/devos-mason-repo rev-parse HEAD)" = "$CANDIDATE"
          python - <<'PY'
          import json, os
          receipt = json.load(open("/tmp/mason-receipt.json", encoding="utf-8"))["receipt"]
          assert receipt["outcome"] == "APPLIED"
          assert receipt["post_revision"] == os.environ["CANDIDATE"]
          assert receipt["local_authority_effect"] == "LOCAL_GIT_REF_UPDATED"
          assert receipt["remote_authority_effect"] == "NONE"
          assert receipt["remote_write_performed"] is False
          PY
          python Devos/runtime/mason_execution.py --db /tmp/devos-knowledge.db list
